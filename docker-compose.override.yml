# Auto-applied by `docker compose` alongside docker-compose.yml for local development only.
# Production references pre-built GHCR images (see docker-compose.yml); this overrides that
# with a local build context instead, so `docker compose up --build` builds from the working
# tree rather than pulling from the registry. Compose merges build: on top of a base image:
# service just fine — it builds locally and tags the result with the base file's image name.
# Also restores direct host-port publishing for caddy, which production omits in favor of
# Hostinger's Traefik-based ingress (see docker-compose.yml).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    # Production lets Docker assign an arbitrary host port (see docker-compose.yml) —
    # locally, pin it to 80 instead so it's predictable to hit at http://localhost.
    ports:
      - "80:80"
