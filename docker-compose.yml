# This is the file Hostinger's Compose-from-URL deploy path fetches directly (SPEC.md §9).
# Images are pre-built and pushed to GHCR by .github/workflows/publish-images.yml on every
# merge to main, so this file just references those tags rather than building from a git
# context — `docker compose up` only builds a build:-context image if it doesn't already
# exist locally, so once built once, Hostinger's "Update" button (which just re-pulls/re-ups,
# never rebuilds) kept silently redeploying a stale image no matter how many commits landed.
# Referencing a registry image instead makes "Update" behave the same way it does for every
# other project on this VPS (all of which use image:, not build:) — it actually re-pulls.
# pull_policy: always forces that re-pull unconditionally on every `up`, rather than relying
# on Compose's default (only pull an image: tag if nothing matching is already cached locally)
# — belt-and-braces given how unreliable this deploy path has already proven to be.
# For local development, docker-compose.override.yml overrides this to build from the local
# tree instead of pulling from GHCR.

services:
  caddy:
    image: ghcr.io/pilly170/event-playlist-caddy:latest
    pull_policy: always
    restart: unless-stopped
    # No published port at all: a separate, already-deployed Traefik project on this
    # VPS (see /docker/traefik/docker-compose.yml on the host, CLAUDE.md has the full
    # story) runs with network_mode: host and --providers.docker=true — it reaches any
    # container directly via the Docker socket/bridge network without needing a
    # published host port or a shared network, and issues a real Let's Encrypt
    # certificate via the labels below. --providers.docker.exposedbydefault=false
    # means nothing is routed unless traefik.enable=true is set explicitly.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    labels:
      - traefik.enable=true
      - traefik.http.routers.event-playlist.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.event-playlist.entrypoints=websecure
      - traefik.http.routers.event-playlist.tls.certresolver=letsencrypt
      - traefik.http.services.event-playlist.loadbalancer.server.port=80
    depends_on:
      - app

  app:
    image: ghcr.io/pilly170/event-playlist-app:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DATABASE_PATH: /data/app.db
      DOMAIN: ${DOMAIN}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  caddy_data:
  caddy_config:
  app_data:
